AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One SG/Send Vault (the Secure Send S3 API) in this account and region, stack sws-vault-<id>: an S3 bucket for the
  vault store, the server as a Lambda behind a Function URL, CloudFront in front (with /health for the deploy page),
  and optionally the customer's own domain. Two modes (DeployMode): access-stack, run with RoleARN = the deploy
  role of stack sws-vault-<id>-access (iam.aws.a, step 3); or one-stack, run as the customer's own console
  identity with the boundary in this stack. Dinis decides which the page offers. DRAFT 0.4.4 by cloudformation.aws.a, 23 Nov 2026. Not for use on a real account: see
  docs/cloudformation/2026-11-23__vault-stack-03.md.

Metadata:
  SovereignWebsite:
    TemplateVersion: 0.4.4-draft
    Pinning: served only as an immutable, versioned object whose sha256 the deploy page shows next to the button.
    CreatesNoRoleForUs: true
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Filled in by the deploy link" }
        Parameters: [VaultId, DeployMode, ImageUri, DeployPageOrigin]
      - Label: { default: "Your own domain (optional, add it later)" }
        Parameters: [DomainName, HostedZoneId, CertificateArn]
      - Label: { default: "Advanced" }
        Parameters: [Architecture, ReservedConcurrency]

Parameters:
  VaultId:
    Type: String
    MaxLength: 12
    AllowedPattern: "^[0-9a-f]{12}$"
    Description: The Vault's id, 12 hex digits generated by the deploy page. Every resource is named sws-vault-<id>-*.
  DeployMode:
    Type: String
    # one-stack is the v1 default (iam.aws.a 03-one-button.md; security.aws.a 0affab1, on seven conditions, R-022);
    # access-stack is the opt-in least-privilege mode. Dinis decides on the Vault deploy batch.
    Default: one-stack
    AllowedValues: [access-stack, one-stack]
    Description: >-
      access-stack: run after stack sws-vault-<id>-access, with its deploy role as this stack's IAM role; the boundary
      is that stack's. one-stack: no separate stack or role; the boundary is made here (it caps the Vault's role
      against a mistake in this template; the pinned sha256 is what protects against a changed template).
  ImageUri:
    Type: String
    MaxLength: 512
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$"
    Description: >-
      The SG/Send server image in Amazon ECR, pinned by digest (Lambda runs images from ECR only); the page
      publishes this digest next to the template's sha256. OPEN QUESTION O1, kept open: the official SG/Send
      template's source, an ECR repository we run in each region pulled across accounts, or the customer's own ECR.
  DeployPageOrigin:
    Type: String
    MaxLength: 270
    # Exactly one https origin: a dotted host name whose last label starts with a letter (so no IP literal), an
    # optional port 1-99999 (CORS fails closed beyond 65535), no path, no wildcard (security.aws.a).
    AllowedPattern: "^https://([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]([a-z0-9-]*[a-z0-9])?(:[1-9][0-9]{0,4})?$"
    Description: The deploy page's origin, the only origin /health answers with CORS (D1 decides the address).
  DomainName:
    Type: String
    MaxLength: 253
    Default: ""
    AllowedPattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    Description: Leave empty for the CloudFront address. To add your own domain, run vault-edge.yaml in us-east-1 first.
  HostedZoneId:
    Type: String
    MaxLength: 32
    Default: ""
    # A String, not AWS::Route53::HostedZone::Id: that type cannot be empty, and empty means "DNS elsewhere".
    AllowedPattern: "^$|^Z[A-Z0-9]{1,31}$"
    Description: The Route 53 hosted zone holding DomainName, if it is in this account. Empty means your DNS is elsewhere.
  CertificateArn:
    Type: String
    Default: ""
    Description: The certificate from vault-edge.yaml (us-east-1). Needed with DomainName.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  ReservedConcurrency:
    Type: String
    Default: "10"
    AllowedPattern: "^$|^[1-9][0-9]{0,3}$"
    Description: >-
      Cap on how many copies of the server run at once (the Function URL is public; security.aws.a condition c).
      Raise it as the Vault grows; empty removes the cap. Reserving needs spare concurrency in the account: a new
      account with a low Lambda quota may refuse it (then ask AWS for a higher quota, or empty this).

Conditions:
  OneStack: !Equals [!Ref DeployMode, one-stack]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasZone: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]
  DnsElsewhere: !And [!Condition HasDomain, !Equals [!Ref HostedZoneId, ""]]
  HasConcurrencyCap: !Not [!Equals [!Ref ReservedConcurrency, ""]]

Rules:
  DomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: With DomainName, CertificateArn (from vault-edge.yaml in us-east-1) is needed.

Resources:
  # ---- storage ----
  VaultBucket:
    Type: AWS::S3::Bucket
    # Retain (vaults.aws.a, iam.aws.a, security.aws.a): deleting the stack never deletes a Vault's data, and the
    # deploy role holds no s3:DeleteBucket. Removing the data is a separate, explicit step for the customer.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

  VaultBucketPolicy:
    Type: AWS::S3::BucketPolicy
    # Retain with the bucket: the kept bucket stays TLS-only and this-account-only, and the deploy role holds no
    # s3:DeleteBucketPolicy (iam.aws.a's vault-access.yaml), so Delete would fail the stack's deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref VaultBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt VaultBucket.Arn, !Sub "${VaultBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: ThisAccountOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt VaultBucket.Arn, !Sub "${VaultBucket.Arn}/*"]
            Condition: { StringNotEquals: { "aws:PrincipalAccount": !Ref AWS::AccountId } }

  # ---- the access token (SGRAPH_SEND__ACCESS_TOKEN gates every route) ----
  AccessToken:
    Type: AWS::SecretsManager::Secret
    # Always generated here. No bring-your-own secret in v1 (security.aws.a): the dynamic reference resolves as the
    # deploy role, which may read only this secret; an arbitrary ARN would push that role towards reading any secret.
    Properties:
      Name: !Sub "sws-vault-${VaultId}-token"
      Description: The Vault's access token. Read it in the Secrets Manager console to sign in to the Vault.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

  # ---- the boundary, in one-stack mode only (in access-stack mode it is the -access stack's, by the same name) ----
  VaultBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: OneStack
    Properties:
      ManagedPolicyName: !Sub "sws-vault-${VaultId}-boundary"
      Description: The most the Vault's own role may ever do, whatever is attached to it.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ThisVaultsBucket
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}"
              - !Sub "arn:${AWS::Partition}:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}/*"
          - Sid: ThisVaultsLogs
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sws-vault-${VaultId}-api:*"

  # ---- the server's role, inside the boundary ----
  VaultFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "sws-vault-${VaultId}-api"
      PermissionsBoundary: !If
        - OneStack
        - !Ref VaultBoundary
        - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/sws-vault-${VaultId}-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId } }
      Policies:
        - PolicyName: vault
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The exact S3 actions the server needs are to be settled from its source (vaults.aws.a, section 8).
              - Sid: ThisVaultsBucket
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource: [!GetAtt VaultBucket.Arn, !Sub "${VaultBucket.Arn}/*"]
              - Sid: ThisVaultsLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt VaultLogs.Arn
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

  VaultLogs:
    Type: AWS::Logs::LogGroup
    # Retain: the server's logs are the Vault's audit trail (security.aws.a); the deploy role holds no DeleteLogGroup.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/sws-vault-${VaultId}-api"
      RetentionInDays: 30
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

  # ---- the server ----
  VaultFunction:
    Type: AWS::Lambda::Function
    DependsOn: VaultLogs
    Properties:
      FunctionName: !Sub "sws-vault-${VaultId}-api"
      Description: SG/Send Vault server (Secure Send S3 API).
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      Architectures: [!Ref Architecture]
      Role: !GetAtt VaultFunctionRole.Arn
      MemorySize: 1024
      Timeout: 30
      ReservedConcurrentExecutions: !If [HasConcurrencyCap, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Environment:
        Variables:
          SEND__STORAGE_MODE: s3
          SEND__S3_BUCKET: !Ref VaultBucket
          # OPEN QUESTION O3 (iam.aws.a's call): a dynamic reference puts the token in the function's configuration,
          # readable in this account with lambda:GetFunctionConfiguration. Reading it at start needs server support.
          SGRAPH_SEND__ACCESS_TOKEN: !Sub "{{resolve:secretsmanager:${AccessToken}:SecretString}}"
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

  VaultFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt VaultFunction.Arn
      # NONE at the AWS layer: the server's token gates every route (vaults.aws.a; O4 with security.aws.a).
      AuthType: NONE

  VaultFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VaultFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Function URLs created from October 2025 also need lambda:InvokeFunction (AWS Lambda guide, urls-auth, read by
  # boto3.aws.a). InvokedViaFunctionUrl limits it to calls through the URL, so it never opens the Invoke API to "*".
  VaultFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VaultFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---- /health for the deploy page (vaults.aws.a design 04, 4a): fixed JSON, CORS for the deploy page only ----
  HealthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "sws-vault-${VaultId}-health"
      AutoPublish: true
      FunctionConfig:
        Comment: Answers /health with the Vault id and template version; never reaches the server.
        Runtime: cloudfront-js-2.0
      # CHECK the cloudfront-js-2.0 response shape (body as { encoding, data }) against AWS's documentation.
      FunctionCode: !Sub |
        function handler(event) {
          var h = {
            "content-type": { value: "application/json" },
            "cache-control": { value: "no-store" },
            "access-control-allow-origin": { value: "${DeployPageOrigin}" },
            "access-control-allow-methods": { value: "GET" },
            "vary": { value: "Origin" }
          };
          if (event.request.method === "OPTIONS") return { statusCode: 204, statusDescription: "No Content", headers: h };
          if (event.request.method !== "GET") return { statusCode: 405, statusDescription: "Method Not Allowed", headers: h };
          return { statusCode: 200, statusDescription: "OK", headers: h,
            body: { encoding: "text", data: JSON.stringify({ vault_id: "${VaultId}", template_version: "0.4.4-draft" }) } };
        }

  # ---- CloudFront in front, from phase 1 ----
  VaultDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "sws-vault-${VaultId}"
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: vault-api
            DomainName: !Select [2, !Split ["/", !GetAtt VaultFunctionUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        CacheBehaviors:
          - PathPattern: /health
            TargetOriginId: vault-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt HealthFunction.FunctionARN
        DefaultCacheBehavior:
          TargetOriginId: vault-api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
          # AWS managed policies, by id. CHECK both against AWS's managed policy pages before use.
          # CachingDisabled (O6: cache -imm- objects later); AllViewerExceptHostHeader (the Function URL needs its own Host).
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

  # ---- the customer's own name, when its zone is in this account. In the stack, never by hand: the records
  # reference the distribution, so CloudFormation deletes them before it and no name is left dangling. ----
  VaultRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt VaultDistribution.DomainName
        # CloudFront's fixed alias zone id. CHECK against AWS's AliasTarget documentation before use.
        HostedZoneId: Z2FDTNDATAQYW2
  VaultRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt VaultDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  Endpoint:
    Description: The Vault's address.
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${VaultDistribution.DomainName}"]
  HealthCheck:
    Description: The server's own health route (needs the access token).
    Value: !If [HasDomain, !Sub "https://${DomainName}/api/info/health", !Sub "https://${VaultDistribution.DomainName}/api/info/health"]
  DeployCheck:
    Description: What the deploy page reads, with no token. It returns the Vault id and template version.
    Value: !If [HasDomain, !Sub "https://${DomainName}/health", !Sub "https://${VaultDistribution.DomainName}/health"]
  TokenSecretArn:
    Description: Where the access token is. The token itself is never an output.
    Value: !Ref AccessToken
  DnsRecords:
    Condition: DnsElsewhere
    Description: Create this record at your DNS provider.
    Value: !Sub "${DomainName} CNAME ${VaultDistribution.DomainName}"
  BucketName:
    Value: !Ref VaultBucket
  DistributionId:
    Value: !Ref VaultDistribution
  VaultId:
    Value: !Ref VaultId
  AccountId:
    Value: !Ref AWS::AccountId
  Region:
    Value: !Ref AWS::Region
  DeployMode:
    Value: !Ref DeployMode
  TemplateVersion:
    Value: 0.4.4-draft
