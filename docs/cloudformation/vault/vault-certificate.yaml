AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The certificate for a Vault's own domain. CloudFront takes certificates from us-east-1 only, so this small stack
  runs there, whatever region the Vault is in. ACM validates it by DNS in the given hosted zone. Its output goes into
  the Vault stack's CertificateArn. DRAFT 0.1.0 by cloudformation.aws.a, 23 Nov 2026.

Metadata:
  SovereignWebsite:
    TemplateVersion: 0.1.0-draft

Parameters:
  DomainName:
    Type: String
    AllowedPattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    Description: The Vault's own domain, for example vault.example.com.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 hosted zone that holds DomainName.

Rules:
  OnlyInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: CloudFront uses certificates from us-east-1 only. Run this stack in us-east-1.

Resources:
  VaultCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

Outputs:
  CertificateArn:
    Value: !Ref VaultCertificate
