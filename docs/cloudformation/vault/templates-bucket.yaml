AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack sws-vault-templates-<region>, in OUR account: the bucket the Vault deploy page's quick-create links point at.
  Published template files can never be overwritten or deleted (S3 Object Lock, compliance mode), only the publishing
  role writes, and anyone may read templates/* (CloudFormation fetches a quick-create template from S3 as the
  customer, from their own account). DRAFT 0.1.2 by cloudformation.aws.a, 23 Nov 2026: a plan for aws.c to prepare
  and Dinis to approve, not for use before then.

Metadata:
  SovereignWebsite:
    TemplateVersion: 0.1.2-draft

Parameters:
  PublisherRoleArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$"
    MaxLength: 512
    Description: The only role that may write published templates (for example the repository's GitHub Actions OIDC role; aws.c and iam.aws.a decide).
  RetentionYears:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 100
    Description: >-
      How long each published file is locked. In compliance mode nobody, including the account's root user, can
      delete or shorten it before then, and the bucket cannot be deleted while files are locked. Every publish,
      mistakes included, stays public that long. 1 proposed (security.aws.a); a decision for Dinis.

Resources:
  TemplatesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "sws-vault-templates-${AWS::AccountId}-${AWS::Region}"
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Years: !Ref RetentionYears
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      # Public read of templates/* needs a public bucket policy; ACLs stay blocked.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      Tags:
        - { Key: sws-vault, Value: templates }

  TemplatesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref TemplatesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AnyoneReadsPublishedTemplates
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${TemplatesBucket.Arn}/templates/*"
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt TemplatesBucket.Arn, !Sub "${TemplatesBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: OnlyThePublisherWrites
            Effect: Deny
            Principal: "*"
            Action: [s3:PutObject, s3:PutObjectRetention, s3:PutObjectLegalHold]
            Resource: !Sub "${TemplatesBucket.Arn}/*"
            Condition: { ArnNotEquals: { "aws:PrincipalArn": !Ref PublisherRoleArn } }
          # Object Lock keeps every old version, but a write to an existing key would add a NEW current version, and a
          # quick-create link (no versionId) fetches the current one. So writes must be create-only: S3 conditional
          # writes (If-None-Match: *) enforced by the s3:if-none-match condition key. CHECK that key's name and
          # behaviour confirmed by boto3.aws.a (S3 user guide, conditional-writes-enforce, note 12). Multipart is refused
          # by the same statement: UploadPart is authorised as s3:PutObject and cannot carry If-None-Match. The other hole
          # (a delete marker lets a conditional PUT succeed) is closed by NobodyDeletes, which denies s3:DeleteObject.
          - Sid: CreateOnlyNeverOverwrite
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${TemplatesBucket.Arn}/*"
            Condition: { "Null": { "s3:if-none-match": "true" } }
          - Sid: NobodyDeletes
            Effect: Deny
            Principal: "*"
            Action: [s3:DeleteObject, s3:DeleteObjectVersion, s3:BypassGovernanceRetention]
            Resource: !Sub "${TemplatesBucket.Arn}/*"
          # Root only, and any use of root here is an alarm. Once this policy is in place, a later change to the policy,
          # the public access block or ownership (including a stack update) needs the account root.
          - Sid: NobodyLoosensThisPolicyOrTheLock
            Effect: Deny
            Principal: "*"
            Action: [s3:PutBucketPolicy, s3:DeleteBucketPolicy, s3:PutBucketPublicAccessBlock, s3:PutBucketOwnershipControls,
              s3:PutBucketObjectLockConfiguration, s3:PutBucketVersioning, s3:DeleteBucket]
            Resource: !GetAtt TemplatesBucket.Arn
            Condition: { ArnNotEquals: { "aws:PrincipalArn": !Sub "arn:aws:iam::${AWS::AccountId}:root" } }

Outputs:
  BucketName:
    Value: !Ref TemplatesBucket
  TemplateUrlPrefix:
    Description: >-
      The page's index URLs start with this (path style), each ending ?versionId=<id> of the published version, so a
      link names one exact, locked version (boto3.aws.a note 12). One bucket serves every region's console.
    Value: !Sub "https://s3.${AWS::Region}.amazonaws.com/${TemplatesBucket}/templates/"
