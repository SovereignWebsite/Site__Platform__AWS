AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack sws-vault-<id>-edge, always in us-east-1: what CloudFront takes only from us-east-1. (1) The certificate for
  a Vault's own domain (optional): with the domain's hosted zone in this account ACM validates by DNS on its own;
  with DNS elsewhere the stack waits for the validation record that CloudFormation shows in the stack's events.
  (2) An optional WAF web ACL with a per-address rate limit (off by
  default: billing.aws.a finds it adds cost rather than capping it). Its outputs go into the Vault stack's CertificateArn and WebAclArn.
  DRAFT 0.6.1 by cloudformation.aws.a, 23 Nov 2026.

Metadata:
  SovereignWebsite:
    TemplateVersion: 0.6.1-draft

Parameters:
  VaultId:
    Type: String
    MaxLength: 12
    AllowedPattern: "^[0-9a-f]{12}$"
  DomainName:
    Type: String
    MaxLength: 253
    Default: ""
    AllowedPattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    Description: Optional. The Vault's own domain, for example vault.example.com. Empty means no certificate.
  HostedZoneId:
    Type: String
    MaxLength: 32
    Default: ""
    AllowedPattern: "^$|^Z[A-Z0-9]{1,31}$"
    Description: >-
      The Route 53 hosted zone holding DomainName, if it is in this account. Empty means DNS is elsewhere. ACM's
      validation record (a CNAME) stays in the zone after this stack is deleted; remove it by hand if wanted.
  EnableRateLimit:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Create a WAF web ACL that blocks any one address above RateLimit requests per RateWindowSec (availability protection only; it adds cost, billing.aws.a).
  RateLimit:
    Type: Number
    Default: 1000
    MinValue: 10
    MaxValue: 2000000000
    Description: Requests per address per window before WAF blocks it (WAF allows 10 to 2,000,000,000; boto3.aws.a note 15).
  RateWindowSec:
    Type: Number
    Default: 300
    AllowedValues: [60, 120, 300, 600]
    Description: The rate limit's evaluation window in seconds (the values WAF allows).

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasZone: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]
  RateLimitOn: !Equals [!Ref EnableRateLimit, "true"]

Rules:
  # Refused here with our own message rather than relying on what CloudFormation says about a stack whose every
  # resource is switched off (not documented as far as we know).
  SomethingToMake:
    Assertions:
      - Assert: !Or [!Not [!Equals [!Ref DomainName, ""]], !Equals [!Ref EnableRateLimit, "true"]]
        AssertDescription: Nothing to create. Give a DomainName (for a certificate) or set EnableRateLimit to true.
  OnlyInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: CloudFront takes certificates and web ACLs from us-east-1 only. Run this stack in us-east-1.

Resources:
  VaultCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

  # A per-address rate limit. It caps one source, not a flood spread over many addresses; billing.aws.a prices it
  # (WAF has its own charges) and boto3.aws.a checks whether blocked requests still carry CloudFront's request charge.
  VaultWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: RateLimitOn
    Properties:
      Name: !Sub "sws-vault-${VaultId}-waf"
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "sws-vault-${VaultId}-waf"
      Rules:
        - Name: per-address-rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimit
              EvaluationWindowSec: !Ref RateWindowSec
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "sws-vault-${VaultId}-rate"
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

Outputs:
  CertificateArn:
    Condition: HasDomain
    Value: !Ref VaultCertificate
  WebAclArn:
    Condition: RateLimitOn
    Value: !GetAtt VaultWebAcl.Arn
