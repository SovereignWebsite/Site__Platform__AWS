AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DRAFT 0.1.2 (iam.aws.a), the role of the Vault cost kill switch, for ec2.aws.a's design 03 (a8696af section 3) and
  for cloudformation.aws.a to fold into the alarm stack sws-vault-<id>-alarm (us-east-1). Shown here as its own
  template only so it can be linted. Created by the customer's own identity, like the alarm (R-027), never by the
  deploy role. Pauses one Vault; never deletes, never restores, nothing else.

Parameters:
  VaultId:
    Type: String
    AllowedPattern: "^[0-9a-f]{12}$"
  VaultRegion:
    Type: String
    AllowedPattern: "^[a-z]{2}(-[a-z]+)+-[0-9]$"
    Description: The region of stack sws-vault-<id>, where the function sws-vault-<id>-api runs.
  DistributionId:
    Type: String
    AllowedPattern: "^E[A-Z0-9]{8,20}$"
    Description: The Vault's CloudFront distribution (vault.yaml output DistributionId).

Resources:
  KillSwitchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "sws-vault-${VaultId}-killswitch"
      Description: Pauses one Vault when its cost alarm fires; never deletes or restores
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: pause-this-vault
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Lever 1: disable the one distribution. UpdateDistribution takes the whole configuration, and IAM
              # cannot limit it to "Enabled: false", so this role can change anything on this one distribution
              # (its origin included). Held by the function's code: inline in the pinned template, it only flips
              # Enabled. Recorded as the residual.
              - Sid: DisableTheOneDistribution
                Effect: Allow
                Action: [cloudfront:GetDistribution, cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution, cloudfront:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
              # Lever 2: throttle the one function to zero. PutFunctionConcurrency takes any value; the code sets 0.
              - Sid: ThrottleTheOneFunction
                Effect: Allow
                Action: [lambda:PutFunctionConcurrency, lambda:GetFunctionConcurrency, lambda:ListTags]
                Resource: !Sub "arn:aws:lambda:${VaultRegion}:${AWS::AccountId}:function:sws-vault-${VaultId}-api"
              # design 03 (8fd2c77): mark both as paused (sws-vault-paused=<time>), so a Vault stack update cannot
              # silently undo the pause. That one tag key only (aws:TagKeys), on these two resources only.
              - Sid: MarkPausedDistribution
                Effect: Allow
                Action: cloudfront:TagResource
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                Condition:
                  ForAllValues:StringEquals: { "aws:TagKeys": [sws-vault-paused] }
              - Sid: MarkPausedFunction
                Effect: Allow
                Action: lambda:TagResource
                Resource: !Sub "arn:aws:lambda:${VaultRegion}:${AWS::AccountId}:function:sws-vault-${VaultId}-api"
                Condition:
                  ForAllValues:StringEquals: { "aws:TagKeys": [sws-vault-paused] }
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/lambda/sws-vault-${VaultId}-killswitch:*"
              # Never restore (a person does, design 03 section 4), never delete, nothing else.
              - Sid: NeverRestoreOrDelete
                Effect: Deny
                Action: [lambda:DeleteFunctionConcurrency, lambda:DeleteFunction, lambda:UpdateFunctionConfiguration,
                  lambda:UpdateFunctionCode, lambda:AddPermission, cloudfront:DeleteDistribution, cloudfront:CreateDistribution,
                  "iam:*", "s3:*", "secretsmanager:*", "ec2:*", "ssm:*"]
                Resource: "*"
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

Outputs:
  KillSwitchRoleArn:
    Value: !GetAtt KillSwitchRole.Arn
