AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SG/Send Vault access stack sws-vault-<id>-access, DRAFT 0.1.4 (iam.aws.a, deploy plan step 3; for review by
  security.aws.a and cloudformation.aws.a; not for any real account). Run first, by the customer, from their own
  console. Makes two things only: the deploy role that stacks sws-vault-<id> and sws-vault-<id>-edge run with, and
  the boundary that caps the Vault's own role. Nothing here can reach outside this one Vault's resources.

Parameters:
  VaultId:
    Type: String
    # Same pattern as cloudformation.aws.a's vault.yaml 0.3.0 (e92ee88): 12 lower-case hex, generated by the page.
    AllowedPattern: "^[0-9a-f]{12}$"
    Description: The Vault's id, chosen by the deploy page. Every resource is named sws-vault-<id>-*.
  DomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    Description: Optional. The Vault's own name, for example vault.example.com, lower case.
  HostedZoneId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^Z[A-Z0-9]{1,31}$"
    Description: Optional. The Route 53 hosted zone (in this account) that holds DomainName. Empty means DNS is elsewhere.
  ImageRepositoryArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:ecr:[a-z0-9-]+:[0-9]{12}:repository/[a-z0-9._/-]+$"
    Description: The ECR repository the Vault's image is pulled from (open question O1).
  ReadTokenAtDeploy:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      true while the server takes its token from the environment (a CloudFormation dynamic reference resolves as this
      role, so it reads the secret once). Twin only (security.aws.a point 18); false once the server reads it at start-up.

Conditions:
  HasZone: !And [!Not [!Equals [!Ref DomainName, ""]], !Not [!Equals [!Ref HostedZoneId, ""]]]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasImageRepo: !Not [!Equals [!Ref ImageRepositoryArn, ""]]
  ReadsToken: !Equals [!Ref ReadTokenAtDeploy, "true"]

Resources:
  # The most the Vault's own role (sws-vault-<id>-api) may ever do, whatever the Vault template says.
  # S3 actions are provisional until the server's source is read (vaults.aws.a design 04, section 8 question 2).
  VaultBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "sws-vault-${VaultId}-boundary"
      Description: The most the Vault's own role may do (iam.aws.a, deploy plan step 3)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ThisVaultsBucket
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
            Resource:
              - !Sub "arn:aws:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}"
              - !Sub "arn:aws:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}/*"
          - Sid: ThisVaultsToken
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sws-vault-${VaultId}-token-??????"
          - Sid: ThisVaultsLogs
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sws-vault-${VaultId}-api:*"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "sws-vault-${VaultId}-deploy"
      Description: The service role stacks sws-vault-<id> and sws-vault-<id>-edge run with; this Vault's resources only
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
              # Whether CloudFormation sets aws:SourceArn when it assumes a service role is open (boto3.aws.a).
              # If it does not, this condition must go, or the role cannot be assumed: test in the twin first.
              ArnLike:
                "aws:SourceArn":
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/sws-vault-${VaultId}/*"
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/sws-vault-${VaultId}-edge/*"
      Policies:
        - PolicyName: vault
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bucket
                Effect: Allow
                Action: [s3:CreateBucket, s3:GetBucketLocation, s3:GetBucketTagging, s3:PutBucketTagging,
                  s3:GetBucketPublicAccessBlock, s3:PutBucketPublicAccessBlock, s3:GetEncryptionConfiguration,
                  s3:PutEncryptionConfiguration, s3:GetBucketVersioning, s3:PutBucketVersioning,
                  s3:GetBucketOwnershipControls, s3:PutBucketOwnershipControls, s3:GetBucketPolicy, s3:PutBucketPolicy,
                  s3:GetBucketAcl, s3:ListBucket, s3:TagResource, s3:UntagResource]
                Resource: !Sub "arn:aws:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}"
              - Sid: Token
                Effect: Allow
                Action: [secretsmanager:CreateSecret, secretsmanager:DescribeSecret, secretsmanager:DeleteSecret,
                  secretsmanager:UpdateSecret, secretsmanager:TagResource, secretsmanager:UntagResource,
                  secretsmanager:RemoveRegionsFromReplication]
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sws-vault-${VaultId}-token-??????"
              - Sid: RandomForTheToken
                Effect: Allow
                Action: secretsmanager:GetRandomPassword
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:PutRetentionPolicy, logs:TagResource, logs:UntagResource, logs:ListTagsForResource,
                  logs:GetDataProtectionPolicy]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sws-vault-${VaultId}-api*"
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: TheVaultsRoleOnlyWithTheBoundary
                Effect: Allow
                Action: iam:CreateRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sws-vault-${VaultId}-api"
                Condition:
                  StringEquals: { "iam:PermissionsBoundary": !Ref VaultBoundary }
              - Sid: TheVaultsRole
                Effect: Allow
                Action: [iam:GetRole, iam:DeleteRole, iam:PutRolePolicy, iam:GetRolePolicy, iam:DeleteRolePolicy,
                  iam:TagRole, iam:UntagRole, iam:ListRoleTags, iam:ListRolePolicies, iam:ListAttachedRolePolicies,
                  iam:DetachRolePolicy]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sws-vault-${VaultId}-api"
              - Sid: PassTheVaultsRoleToLambdaOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sws-vault-${VaultId}-api"
                Condition:
                  StringEquals: { "iam:PassedToService": lambda.amazonaws.com }
              - Sid: Function
                Effect: Allow
                Action: [lambda:CreateFunction, lambda:GetFunction, lambda:GetFunctionConfiguration,
                  lambda:UpdateFunctionCode, lambda:UpdateFunctionConfiguration, lambda:DeleteFunction,
                  lambda:TagResource, lambda:UntagResource, lambda:ListTags,
                  lambda:PutFunctionConcurrency, lambda:DeleteFunctionConcurrency,
                  lambda:GetFunctionUrlConfig, lambda:UpdateFunctionUrlConfig, lambda:DeleteFunctionUrlConfig,
                  lambda:RemovePermission, lambda:GetPolicy, lambda:GetFunctionCodeSigningConfig,
                  lambda:GetRuntimeManagementConfig, lambda:GetFunctionRecursionConfig]
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sws-vault-${VaultId}-api"
              # security.aws.a ruling (d): a public principal only for a Function URL with auth NONE.
              - Sid: FunctionUrlNoneOnly
                Effect: Allow
                Action: [lambda:CreateFunctionUrlConfig, lambda:AddPermission]
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sws-vault-${VaultId}-api"
                Condition:
                  StringEquals: { "lambda:FunctionUrlAuthType": NONE }
              - !If
                - HasImageRepo
                - Sid: PullTheImage
                  Effect: Allow
                  Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                  Resource: !Ref ImageRepositoryArn
                - !Ref AWS::NoValue
              - !If
                - ReadsToken
                - Sid: DynamicReferenceTwinOnly
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sws-vault-${VaultId}-token-??????"
                - !Ref AWS::NoValue
              - Sid: HealthFunction
                Effect: Allow
                Action: [cloudfront:CreateFunction, cloudfront:DescribeFunction, cloudfront:UpdateFunction,
                  cloudfront:PublishFunction, cloudfront:DeleteFunction, cloudfront:TagResource, cloudfront:UntagResource,
                  cloudfront:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:function/sws-vault-${VaultId}-health"
              # Tag only in the create request (security.aws.a point 4); change and delete only what carries this id.
              # security.aws.a review 0.1.0 (1): TagResource on "*" with only aws:RequestTag would let the role tag a
              # customer's existing distribution and then change or delete it. So create carries no tagging right;
              # tagging and every change only where the distribution already carries sws-vault = <id>, and an
              # explicit deny otherwise (NeverTagOthers below). If CreateDistributionWithTags cannot then tag the new
              # distribution (boto3.aws.a to check), scope by the distribution id instead (an output passed back on update).
              - Sid: DistributionCreate
                Effect: Allow
                Action: cloudfront:CreateDistribution
                Resource: "*"
                Condition:
                  StringEquals: { "aws:RequestTag/sws-vault": !Ref VaultId }
              - Sid: DistributionOwnOnly
                Effect: Allow
                Action: [cloudfront:GetDistribution, cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution,
                  cloudfront:DeleteDistribution, cloudfront:TagResource, cloudfront:UntagResource, cloudfront:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
                Condition:
                  StringEquals: { "aws:ResourceTag/sws-vault": !Ref VaultId }
              - !If
                - HasDomain
                - Sid: CertificateCreateTagged
                  Effect: Allow
                  Action: acm:RequestCertificate
                  Resource: "*"
                  Condition:
                    StringEquals: { "aws:RequestTag/sws-vault": !Ref VaultId }
                - !Ref AWS::NoValue
              - !If
                - HasDomain
                - Sid: CertificateOwnOnly
                  Effect: Allow
                  Action: [acm:DescribeCertificate, acm:DeleteCertificate, acm:AddTagsToCertificate, acm:RemoveTagsFromCertificate,
                    acm:ListTagsForCertificate, acm:UpdateCertificateOptions]
                  Resource: !Sub "arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/*"
                  Condition:
                    StringEquals: { "aws:ResourceTag/sws-vault": !Ref VaultId }
                - !Ref AWS::NoValue
              # security.aws.a point 5: the one zone by id, the Vault's name and the certificate's validation name only,
              # A, AAAA and CNAME only (no NS, no SOA, no delegation). ACM's validation name is "_" plus a fixed-length
              # token directly under the name (32 characters as security.aws.a recalls; boto3.aws.a to confirm), so 32 "?"
              # rather than "*": it cannot match _acme-challenge or _dmarc (security.aws.a review 0.1.0 (2)).
              - !If
                - HasZone
                - Sid: DnsTheseNamesOnly
                  Effect: Allow
                  Action: route53:ChangeResourceRecordSets
                  Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                  Condition:
                    ForAllValues:StringLike:
                      "route53:ChangeResourceRecordSetsNormalizedRecordNames": [!Ref DomainName, !Sub "_????????????????????????????????.${DomainName}"]
                      "route53:ChangeResourceRecordSetsActions": [CREATE, UPSERT, DELETE]
                    ForAllValues:StringEquals:
                      "route53:ChangeResourceRecordSetsRecordTypes": [A, AAAA, CNAME]
                - !Ref AWS::NoValue
              - !If
                - HasZone
                - Sid: DnsRead
                  Effect: Allow
                  Action: [route53:GetHostedZone, route53:ListResourceRecordSets]
                  Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                - !Ref AWS::NoValue
              - !If
                - HasZone
                - Sid: DnsChangeStatus
                  Effect: Allow
                  Action: route53:GetChange
                  Resource: "arn:aws:route53:::change/*"
                - !Ref AWS::NoValue
              - !If
                - HasZone
                - Sid: DnsListZones
                  Effect: Allow
                  Action: route53:ListHostedZones
                  Resource: "*"
                - !Ref AWS::NoValue
              # Never: the role itself, the boundary, trust edits, new principals, data or audit deletion,
              # secret sharing, or any other stack (security.aws.a points 2, 19, 20, 21).
              - Sid: NeverItselfOrTheBoundary
                Effect: Deny
                Action: "*"
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sws-vault-${VaultId}-deploy"
                  - !Ref VaultBoundary
              - Sid: NeverTheseActions
                Effect: Deny
                Action: [iam:UpdateAssumeRolePolicy, iam:PutRolePermissionsBoundary, iam:DeleteRolePermissionsBoundary,
                  iam:CreatePolicy, iam:CreatePolicyVersion, iam:SetDefaultPolicyVersion, iam:DeletePolicy,
                  iam:CreateUser, iam:CreateAccessKey, iam:CreateLoginProfile, iam:AttachRolePolicy,
                  s3:DeleteBucket, s3:DeleteBucketPolicy, logs:DeleteLogGroup,
                  secretsmanager:PutResourcePolicy, secretsmanager:ReplicateSecretToRegions,
                  lambda:InvokeFunction]
                Resource: "*"
              - Sid: NeverTagOthers
                Effect: Deny
                Action: [cloudfront:TagResource, cloudfront:UntagResource]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
                Condition:
                  StringNotEquals: { "aws:ResourceTag/sws-vault": !Ref VaultId }
              # security.aws.a re-review 0.1.2 (2): "?" also matches ".", so the 32-character validation pattern could
              # match a two-label name of that length (_acme-challenge.<16 chars>.<domain>: DNS-01 for a new subdomain).
              # Refuse any name two or more labels under the domain; the Vault's name and ACM's one-label token pass.
              - !If
                - HasZone
                - Sid: NeverDeeperNames
                  Effect: Deny
                  Action: route53:ChangeResourceRecordSets
                  Resource: "*"
                  Condition:
                    ForAnyValue:StringLike:
                      "route53:ChangeResourceRecordSetsNormalizedRecordNames": !Sub "*.*.${DomainName}"
                - !Ref AWS::NoValue
              - Sid: NeverAnotherStack
                Effect: Deny
                Action: "cloudformation:*"
                NotResource:
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/sws-vault-${VaultId}/*"
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/sws-vault-${VaultId}-edge/*"
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

Outputs:
  DeployRoleArn:
    Description: Pass as RoleARN when creating stacks sws-vault-<id> and sws-vault-<id>-edge
    Value: !GetAtt DeployRole.Arn
  BoundaryArn:
    Value: !Ref VaultBoundary
