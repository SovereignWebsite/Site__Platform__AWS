AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SG/Send Vault access stack sws-vault-<id>-access, DRAFT 0.2.10 (iam.aws.a, deploy plan step 3; for review by
  security.aws.a and cloudformation.aws.a; not for any real account). Run first, by the customer, from their own
  console. Makes two things only: the deploy role that stacks sws-vault-<id> and sws-vault-<id>-edge run with, and
  the boundary that caps the Vault's own role. Nothing here can reach outside this one Vault's resources.

Parameters:
  VaultId:
    Type: String
    # Same pattern as cloudformation.aws.a's vault.yaml 0.3.0 (e92ee88): 12 lower-case hex, generated by the page.
    AllowedPattern: "^[0-9a-f]{12}$"
    Description: The Vault's id, chosen by the deploy page. Every resource is named sws-vault-<id>-*.
  DomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
    Description: Optional. The Vault's own name, for example vault.example.com, lower case.
  HostedZoneId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^Z[A-Z0-9]{1,31}$"
    Description: Optional. The Route 53 hosted zone (in this account) that holds DomainName. Empty means DNS is elsewhere.
  ImageRepositoryArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:ecr:[a-z0-9-]+:[0-9]{12}:repository/[a-z0-9._/-]+$"
    Description: The ECR repository the Vault's image is pulled from (open question O1).
  DistributionId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^E[A-Z0-9]{8,20}$"
    Description: Empty on the first deploy; then the Vault stack's CloudFront distribution id (an output), so updates and teardown reach that one distribution only.
  CertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]{36}$"
    Description: Empty until the -edge stack exists; then its certificate's ARN, so updates and teardown reach that one certificate only.
  ImageRepositoryInThisAccount:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true only if ImageRepositoryArn is in this account; then the role may set that repository's policy so Lambda can pull. For a repository in another account, its owner sets the policy.
  UseWaf:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true only if Dinis chooses the WAF option (vault-edge.yaml's web ACL sws-vault-<id>-waf); off by default.
  ReadTokenAtDeploy:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      true while the server takes its token from the environment (a CloudFormation dynamic reference resolves as this
      role, so it reads the secret once). Twin only (security.aws.a point 18); false once the server reads it at start-up.

Conditions:
  HasZone: !And [!Not [!Equals [!Ref DomainName, ""]], !Not [!Equals [!Ref HostedZoneId, ""]]]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasImageRepo: !Not [!Equals [!Ref ImageRepositoryArn, ""]]
  SetsRepoPolicy: !And [!Condition HasImageRepo, !Equals [!Ref ImageRepositoryInThisAccount, "true"]]
  ReadsToken: !Equals [!Ref ReadTokenAtDeploy, "true"]
  WithWaf: !Equals [!Ref UseWaf, "true"]
  HasDistribution: !Not [!Equals [!Ref DistributionId, ""]]
  HasCertificate: !And [!Condition HasDomain, !Not [!Equals [!Ref CertificateArn, ""]]]

Resources:
  # The most the Vault's own role (sws-vault-<id>-api) may ever do, whatever the Vault template says.
  # S3 actions are provisional until the server's source is read (vaults.aws.a design 04, section 8 question 2).
  VaultBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "sws-vault-${VaultId}-boundary"
      Description: The most the Vault's own role may do (iam.aws.a, deploy plan step 3)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ThisVaultsBucket
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
            Resource:
              - !Sub "arn:aws:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}"
              - !Sub "arn:aws:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}/*"
          - Sid: ThisVaultsToken
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sws-vault-${VaultId}-token-??????"
          - Sid: ThisVaultsLogs
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sws-vault-${VaultId}-api:*"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "sws-vault-${VaultId}-deploy"
      Description: The service role stacks sws-vault-<id> and sws-vault-<id>-edge run with; this Vault's resources only
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            # boto3.aws.a note 09: aws:SourceArn and aws:SourceAccount are documented for CloudFormation's registry
            # roles and StackSets, not for a stack's service role, and either fails closed if not sent. So no source
            # condition until a test stack (a plan for Dinis) shows the keys arrive. The role is still usable only by
            # CloudFormation in this account, by people who can create or update these stacks.
      Policies:
        - PolicyName: vault
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Bucket
                Effect: Allow
                Action: [s3:CreateBucket, s3:GetBucketTagging, s3:PutBucketTagging,
                  s3:GetBucketPublicAccessBlock, s3:PutBucketPublicAccessBlock, s3:GetEncryptionConfiguration,
                  s3:PutEncryptionConfiguration, s3:GetBucketVersioning, s3:PutBucketVersioning,
                  s3:GetBucketOwnershipControls, s3:PutBucketOwnershipControls, s3:GetBucketPolicy, s3:PutBucketPolicy,
                  s3:GetBucketAcl, s3:ListBucket, s3:TagResource, s3:UntagResource]
                Resource: !Sub "arn:aws:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}"
              - Sid: Token
                Effect: Allow
                Action: [secretsmanager:CreateSecret, secretsmanager:DescribeSecret, secretsmanager:DeleteSecret,
                  secretsmanager:UpdateSecret, secretsmanager:TagResource, secretsmanager:UntagResource,
                  secretsmanager:RemoveRegionsFromReplication]
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sws-vault-${VaultId}-token-??????"
              - Sid: RandomForTheToken
                Effect: Allow
                Action: secretsmanager:GetRandomPassword
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:PutRetentionPolicy, logs:TagResource, logs:UntagResource, logs:ListTagsForResource,
                  logs:GetDataProtectionPolicy]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sws-vault-${VaultId}-api*"
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: TheVaultsRoleOnlyWithTheBoundary
                Effect: Allow
                Action: iam:CreateRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sws-vault-${VaultId}-api"
                Condition:
                  StringEquals: { "iam:PermissionsBoundary": !Ref VaultBoundary }
              - Sid: TheVaultsRole
                Effect: Allow
                Action: [iam:GetRole, iam:DeleteRole, iam:PutRolePolicy, iam:GetRolePolicy, iam:DeleteRolePolicy,
                  iam:TagRole, iam:UntagRole, iam:ListRoleTags, iam:ListRolePolicies, iam:ListAttachedRolePolicies,
                  iam:DetachRolePolicy, iam:UpdateRole, iam:UpdateRoleDescription]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sws-vault-${VaultId}-api"
              - Sid: PassTheVaultsRoleToLambdaOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/sws-vault-${VaultId}-api"
                Condition:
                  StringEquals: { "iam:PassedToService": lambda.amazonaws.com }
              - Sid: Function
                Effect: Allow
                Action: [lambda:CreateFunction, lambda:GetFunction,
                  lambda:UpdateFunctionCode, lambda:UpdateFunctionConfiguration, lambda:DeleteFunction,
                  lambda:TagResource, lambda:UntagResource, lambda:ListTags,
                  lambda:PutFunctionConcurrency, lambda:DeleteFunctionConcurrency,
                  lambda:GetFunctionUrlConfig, lambda:UpdateFunctionUrlConfig, lambda:DeleteFunctionUrlConfig,
                  lambda:RemovePermission, lambda:GetPolicy, lambda:GetFunctionCodeSigningConfig,
                  lambda:GetRuntimeManagementConfig, lambda:GetFunctionRecursionConfig,
                  # boto3.aws.a: the create handler lists these; whether it calls them with the properties absent is
                  # not documented. Granted on this function only (small effect), to drop if the test stack never calls them.
                  lambda:PutRuntimeManagementConfig, lambda:PutFunctionRecursionConfig]
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sws-vault-${VaultId}-api"
              # security.aws.a ruling (d): a public principal only for a Function URL with auth NONE.
              # New Function URLs also need lambda:InvokeFunction in the resource policy (boto3.aws.a 08). Allowed only
              # with lambda:InvokedViaFunctionUrl = true (Lambda guide, urls-auth) and principal "*", for this function.
              # The Service Authorization Reference contradicts itself on whether the key is present at AddPermission;
              # without IfExists the Bool fails closed (AccessDenied at deploy), never open. Twin and first run will show.
              - Sid: InvokeOnlyThroughTheUrl
                Effect: Allow
                Action: lambda:AddPermission
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sws-vault-${VaultId}-api"
                Condition:
                  Bool: { "lambda:InvokedViaFunctionUrl": "true" }
                  StringEquals: { "lambda:Principal": "*" }
              # security.aws.a R-024: allows are OR'd, so AddPermission must not appear in a statement without a
              # principal condition. CreateFunctionUrlConfig alone here; AddPermission only in the two statements
              # that pin principal "*", plus an explicit deny for any other principal (below).
              - Sid: FunctionUrlNoneOnly
                Effect: Allow
                Action: lambda:CreateFunctionUrlConfig
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sws-vault-${VaultId}-api"
                Condition:
                  StringEquals: { "lambda:FunctionUrlAuthType": NONE }
              - Sid: UrlInvokePermissionOnly
                Effect: Allow
                Action: lambda:AddPermission
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sws-vault-${VaultId}-api"
                Condition:
                  StringEquals:
                    "lambda:FunctionUrlAuthType": NONE
                    "lambda:Principal": "*"
              - !If
                - HasImageRepo
                # Lambda's images-create guide (boto3.aws.a 08): creating a function from an ECR image needs the
                # repository reads on the caller, and SetRepositoryPolicy when the repository is in this account (so
                # Lambda can pull). SetRepositoryPolicy accepts any policy text (security.aws.a R-024), so it is granted
                # only when the repository is the customer's own (ImageRepositoryInThisAccount); for one in our account
                # the owner sets the policy and this role needs only the reads.
                - Sid: PullTheImage
                  Effect: Allow
                  Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:GetRepositoryPolicy]
                  Resource: !Ref ImageRepositoryArn
                - !Ref AWS::NoValue
              - !If
                - SetsRepoPolicy
                - Sid: LetLambdaPullFromOwnRepository
                  Effect: Allow
                  Action: ecr:SetRepositoryPolicy
                  Resource: !Ref ImageRepositoryArn
                - !Ref AWS::NoValue
              - !If
                - ReadsToken
                - Sid: DynamicReferenceTwinOnly
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sws-vault-${VaultId}-token-??????"
                - !Ref AWS::NoValue
              - Sid: HealthFunction
                Effect: Allow
                Action: [cloudfront:DescribeFunction, cloudfront:UpdateFunction,
                  cloudfront:PublishFunction, cloudfront:DeleteFunction, cloudfront:TagResource, cloudfront:UntagResource,
                  cloudfront:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:function/sws-vault-${VaultId}-health"
              # Tag only in the create request (security.aws.a point 4); change and delete only what carries this id.
              # cloudfront:CreateFunction has no resource type in the SAR (boto3.aws.a 09), so it can only be "*".
              # A CloudFront Function does nothing until a distribution uses it, and distributions are scoped below.
              - Sid: HealthFunctionCreate
                Effect: Allow
                Action: cloudfront:CreateFunction
                Resource: "*"
              # security.aws.a review 0.1.0 (1) and boto3.aws.a 09 (3): tagging at create needs TagResource on a
              # distribution that has no tag yet, so a tag cannot be what scopes changes. Changes and deletion are
              # scoped instead by the distribution's id, passed back from the Vault stack's output (DistributionId):
              # a tag is then a label only, and putting it on a customer's distribution gains nothing.
              - Sid: DistributionCreateTagged
                Effect: Allow
                Action: [cloudfront:CreateDistribution, cloudfront:TagResource]
                Resource: "*"
                Condition:
                  StringEquals: { "aws:RequestTag/sws-vault": !Ref VaultId }
              - Sid: DistributionRead
                Effect: Allow
                Action: [cloudfront:GetDistribution, cloudfront:GetDistributionConfig, cloudfront:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              - !If
                - HasDistribution
                - Sid: DistributionThisOneOnly
                  Effect: Allow
                  Action: [cloudfront:UpdateDistribution, cloudfront:DeleteDistribution, cloudfront:UntagResource]
                  Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                - !Ref AWS::NoValue
              - !If
                - HasDomain
                - Sid: CertificateCreateTagged
                  Effect: Allow
                  Action: [acm:RequestCertificate, acm:AddTagsToCertificate]
                  Resource: "*"
                  Condition:
                    StringEquals: { "aws:RequestTag/sws-vault": !Ref VaultId }
                - !Ref AWS::NoValue
              - !If
                - HasDomain
                - Sid: CertificateRead
                  Effect: Allow
                  Action: [acm:DescribeCertificate, acm:ListTagsForCertificate]
                  Resource: !Sub "arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/*"
                - !Ref AWS::NoValue
              - !If
                - HasCertificate
                - Sid: CertificateThisOneOnly
                  Effect: Allow
                  Action: [acm:DeleteCertificate, acm:RemoveTagsFromCertificate, acm:UpdateCertificateOptions]
                  Resource: !Ref CertificateArn
                - !Ref AWS::NoValue
              # billing.aws.a (cfe70fb): the cost guard rail is a CloudWatch alarm on the distribution's request count,
              # not WAF (which bills every inspected request). CloudFront metrics are in us-east-1, so the alarm is too.
              # Alarms named sws-vault-<id>-* only. What the alarm triggers (the kill switch) is its own design and role.
              # security.aws.a: PutMetricAlarm can point AlarmActions at any ARN, so every action must be this Vault's
              # own topic (ForAllValues: an alarm with no actions passes, any other action is refused). Key name
              # cloudwatch:AlarmActions to be confirmed by boto3.aws.a.
              - Sid: CostAlarm
                Effect: Allow
                Action: cloudwatch:PutMetricAlarm
                Resource: !Sub "arn:aws:cloudwatch:us-east-1:${AWS::AccountId}:alarm:sws-vault-${VaultId}-*"
                Condition:
                  ForAllValues:ArnLike:
                    "cloudwatch:AlarmActions": !Sub "arn:aws:sns:us-east-1:${AWS::AccountId}:sws-vault-${VaultId}-cost"
              - Sid: CostAlarmManage
                Effect: Allow
                Action: [cloudwatch:DeleteAlarms, cloudwatch:TagResource, cloudwatch:UntagResource, cloudwatch:ListTagsForResource]
                Resource: !Sub "arn:aws:cloudwatch:us-east-1:${AWS::AccountId}:alarm:sws-vault-${VaultId}-*"
              # The optional email for the cost alarm (vault-edge.yaml 0.5.0): one topic, nothing wider. The alarm only
              # notifies; the kill switch's role is separate (ec2.aws.a designs it, iam.aws.a its role).
              - Sid: CostTopic
                Effect: Allow
                Action: [sns:CreateTopic, sns:DeleteTopic, sns:GetTopicAttributes, sns:SetTopicAttributes,
                  sns:Unsubscribe, sns:ListSubscriptionsByTopic, sns:TagResource, sns:UntagResource, sns:ListTagsForResource]
                Resource: !Sub "arn:aws:sns:us-east-1:${AWS::AccountId}:sws-vault-${VaultId}-cost"
              # security.aws.a: email subscriptions only (sns:Protocol to be confirmed by boto3.aws.a; fails closed).
              - Sid: CostTopicEmailOnly
                Effect: Allow
                Action: sns:Subscribe
                Resource: !Sub "arn:aws:sns:us-east-1:${AWS::AccountId}:sws-vault-${VaultId}-cost"
                Condition:
                  StringEquals: { "sns:Protocol": email }
              - Sid: CostAlarmDescribe
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              # WAF option (cloudformation.aws.a c30353d), only if chosen: the one web ACL sws-vault-<id>-waf, scope
              # CLOUDFRONT, us-east-1. GetWebACL also for associating it with the distribution (boto3.aws.a to confirm
              # whether attaching needs more). Not granted: payments:GetConnectedAccount (paid marketplace rule groups).
              - !If
                - WithWaf
                - Sid: TheVaultsWebAcl
                  Effect: Allow
                  Action: [wafv2:CreateWebACL, wafv2:GetWebACL, wafv2:UpdateWebACL, wafv2:DeleteWebACL,
                    wafv2:TagResource, wafv2:UntagResource, wafv2:ListTagsForResource]
                  Resource: !Sub "arn:aws:wafv2:us-east-1:${AWS::AccountId}:global/webacl/sws-vault-${VaultId}-waf/*"
                - !Ref AWS::NoValue
              # security.aws.a point 5: the one zone by id, the Vault's name and the certificate's validation name only,
              # A, AAAA and CNAME only (no NS, no SOA, no delegation). ACM's validation name is "_" plus a fixed-length
              # token directly under the name (32 characters as security.aws.a recalls; boto3.aws.a to confirm), so 32 "?"
              # rather than "*": it cannot match _acme-challenge or _dmarc (security.aws.a review 0.1.0 (2)).
              - !If
                - HasZone
                - Sid: DnsTheseNamesOnly
                  Effect: Allow
                  Action: route53:ChangeResourceRecordSets
                  Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                  Condition:
                    ForAllValues:StringLike:
                      "route53:ChangeResourceRecordSetsNormalizedRecordNames": [!Ref DomainName, !Sub "_????????????????????????????????.${DomainName}"]
                      "route53:ChangeResourceRecordSetsActions": [CREATE, UPSERT, DELETE]
                    ForAllValues:StringEquals:
                      "route53:ChangeResourceRecordSetsRecordTypes": [A, AAAA, CNAME]
                - !Ref AWS::NoValue
              - !If
                - HasZone
                - Sid: DnsRead
                  Effect: Allow
                  Action: [route53:GetHostedZone, route53:ListResourceRecordSets]
                  Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                - !Ref AWS::NoValue
              - !If
                - HasZone
                - Sid: DnsChangeStatus
                  Effect: Allow
                  Action: route53:GetChange
                  Resource: "arn:aws:route53:::change/*"
                - !Ref AWS::NoValue
              - !If
                - HasZone
                - Sid: DnsListZones
                  Effect: Allow
                  Action: route53:ListHostedZones
                  Resource: "*"
                - !Ref AWS::NoValue
              # Never: the role itself, the boundary, trust edits, new principals, data or audit deletion,
              # secret sharing, or any other stack (security.aws.a points 2, 19, 20, 21).
              - Sid: NeverItselfOrTheBoundary
                Effect: Deny
                Action: "*"
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/sws-vault-${VaultId}-deploy"
                  - !Ref VaultBoundary
              - Sid: NeverTheseActions
                Effect: Deny
                Action: [iam:UpdateAssumeRolePolicy, iam:PutRolePermissionsBoundary, iam:DeleteRolePermissionsBoundary,
                  iam:CreatePolicy, iam:CreatePolicyVersion, iam:SetDefaultPolicyVersion, iam:DeletePolicy,
                  iam:CreateUser, iam:CreateAccessKey, iam:CreateLoginProfile, iam:AttachRolePolicy,
                  secretsmanager:PutResourcePolicy, secretsmanager:ReplicateSecretToRegions,
                  lambda:InvokeFunction]
                Resource: "*"
              # A tag is a label now, but never relabel another Vault's distribution.
              - Sid: NeverRelabelAnotherVault
                Effect: Deny
                Action: [cloudfront:TagResource, cloudfront:UntagResource]
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
                Condition:
                  "Null": { "aws:ResourceTag/sws-vault": "false" }
                  StringNotEquals: { "aws:ResourceTag/sws-vault": !Ref VaultId }
              # security.aws.a re-review 0.1.2 (2): "?" also matches ".", so the 32-character validation pattern could
              # match a two-label name of that length (_acme-challenge.<16 chars>.<domain>: DNS-01 for a new subdomain).
              # Refuse any name two or more labels under the domain; the Vault's name and ACM's one-label token pass.
              - !If
                - HasZone
                - Sid: NeverDeeperNames
                  Effect: Deny
                  Action: route53:ChangeResourceRecordSets
                  Resource: "*"
                  Condition:
                    ForAnyValue:StringLike:
                      "route53:ChangeResourceRecordSetsNormalizedRecordNames": !Sub "*.*.${DomainName}"
                - !Ref AWS::NoValue
              # vault.yaml: bucket, bucket policy and log group are RetainExceptOnCreate (the documented rollback, boto3.aws.a), so a failed first
              # create rolls them back, as this role. Allowed on exactly these three; data stays: S3 refuses to delete a
              # non-empty bucket (versions included) and this role can never delete objects (NeverEmptyTheBucket).
              # Cost, recorded: a tampered template could delete the Vault's log group (its audit trail); held by the
              # pinned template hash, least-privilege mode only.
              - Sid: RollBackAFailedFirstCreate
                Effect: Allow
                Action: [s3:DeleteBucket, s3:DeleteBucketPolicy]
                Resource: !Sub "arn:aws:s3:::sws-vault-${VaultId}-data-${AWS::AccountId}-${AWS::Region}"
              - Sid: RollBackAFailedFirstCreateLogs
                Effect: Allow
                Action: logs:DeleteLogGroup
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sws-vault-${VaultId}-api"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sws-vault-${VaultId}-api:*"
              - Sid: NeverEmptyTheBucket
                Effect: Deny
                # Lifecycle rules could expire objects; versioning stays allowed (needed at create; suspending it deletes nothing).
                Action: [s3:DeleteObject, s3:DeleteObjectVersion, s3:PutLifecycleConfiguration]
                Resource: "*"
              - Sid: NeverAnyOtherPrincipal
                Effect: Deny
                Action: lambda:AddPermission
                Resource: "*"
                Condition:
                  StringNotEquals: { "lambda:Principal": "*" }
              - Sid: NeverAnotherStack
                Effect: Deny
                Action: "cloudformation:*"
                NotResource:
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/sws-vault-${VaultId}/*"
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/sws-vault-${VaultId}-edge/*"
      Tags:
        - { Key: sws-vault, Value: !Ref VaultId }

Outputs:
  DeployRoleArn:
    Description: Pass as RoleARN when creating stacks sws-vault-<id> and sws-vault-<id>-edge
    Value: !GetAtt DeployRole.Arn
  BoundaryArn:
    Value: !Ref VaultBoundary
