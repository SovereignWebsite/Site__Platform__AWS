<style>
/* Layout: a briefing desk. The stage (the animated decision) on the left, the written brief on the right, the transport bar under the stage. */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#15202e; --mute:#5b6878; --line:#c9d1db;
  --accent:#c47a12;  /* the decision itself: amber */
  --risk:#b4322a; --ok:#11786b; --hold:#6b5bb5;
  --stage:#f8fafb; --chip:#e6ebf0;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --paper:#18212c; --ink:#e4e9ef; --mute:#93a0b0; --line:#2f3b4a;
  --accent:#e9a43c; --risk:#ec6b5f; --ok:#3fbfa9; --hold:#a596f0; --stage:#131b25; --chip:#223040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --paper:#18212c; --ink:#e4e9ef; --mute:#93a0b0; --line:#2f3b4a;
  --accent:#e9a43c; --risk:#ec6b5f; --ok:#3fbfa9; --hold:#a596f0; --stage:#131b25; --chip:#223040; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font:800 clamp(22px,3vw,30px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:8px}
.tabs button{border:0;background:transparent;color:var(--ink);font:500 14px var(--f-body);padding:6px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);box-shadow:0 1px 2px #0002}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.desk{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.desk{grid-template-columns:minmax(0,1fr)}}
.stagebox{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.scenehead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.scenetitle{font:700 17px/1.25 var(--f-display);margin:2px 0 0;text-wrap:balance}
.clock{font:400 12px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;background:var(--stage);aspect-ratio:16/9;max-width:100%}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.caption{min-height:3.6em;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 18px;border-top:1px solid var(--line);background:var(--ink);color:var(--paper);font:500 clamp(14px,1.5vw,16px)/1.45 var(--f-body);text-wrap:balance}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 13px var(--f-body);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:78px}
.btn[aria-pressed="true"]{background:var(--chip)}
.scrub{flex:1 1 200px;min-width:0;accent-color:var(--accent)}
.chapters{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.chapters button{border:1px solid var(--line);background:transparent;color:var(--mute);font:500 12px var(--f-mono);padding:3px 9px;border-radius:999px;cursor:pointer}
.chapters button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.panel h2{font:700 18px/1.25 var(--f-display);margin:0;text-wrap:balance}
.panel h3{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
.panel p{margin:0}
.opts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.opts li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.opts li b{font:700 15px var(--f-display);color:var(--mute)}
.opts li.rec{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.opts li.rec b{color:var(--ok)}
.opts li.no{opacity:.7}
.tag{display:inline-block;font:500 11px var(--f-mono);padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--mute);margin-left:6px;vertical-align:1px}
.tag.rec{background:var(--ok);color:#fff}
.answer{font:700 clamp(18px,2.4vw,24px) var(--f-mono);letter-spacing:.02em;padding:10px 12px;background:var(--chip);border-radius:8px;user-select:all;overflow-wrap:anywhere}
.src{font-size:13px;color:var(--mute)}
.src a{color:inherit}
.note{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
/* storyboard view */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.beat{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;min-width:0}
.beat .thumb{aspect-ratio:16/9;background:var(--stage);position:relative;border-bottom:1px solid var(--line);max-width:100%}
.beat .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.beat .body{padding:10px 12px;display:grid;gap:6px}
.beat .meta{font:500 11px var(--f-mono);color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.beat .nar{font-size:14px}
.beat .vis{font-size:12.5px;color:var(--mute)}
/* SVG vocabulary */
svg text{font-family:var(--f-body);fill:var(--ink)}
.t-s{font-size:13px}.t-m{font-size:16px;font-weight:600}.t-l{font:800 24px var(--f-display)}.t-xl{font:800 44px var(--f-display)}
.t-mono{font-family:var(--f-mono);font-size:12px}
.t-mute{fill:var(--mute)}.t-risk{fill:var(--risk)}.t-ok{fill:var(--ok)}.t-acc{fill:var(--accent)}.t-inv{fill:var(--paper)}
.bx{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.bx-risk{fill:color-mix(in srgb,var(--risk) 10%,var(--paper));stroke:var(--risk);stroke-width:2}
.bx-ok{fill:color-mix(in srgb,var(--ok) 10%,var(--paper));stroke:var(--ok);stroke-width:2}
.bx-acc{fill:color-mix(in srgb,var(--accent) 12%,var(--paper));stroke:var(--accent);stroke-width:2}
.bx-hold{fill:color-mix(in srgb,var(--hold) 10%,var(--paper));stroke:var(--hold);stroke-width:2}
.bx-ghost{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
.fill-ink{fill:var(--ink)}.fill-risk{fill:var(--risk)}.fill-ok{fill:var(--ok)}.fill-acc{fill:var(--accent)}.fill-chip{fill:var(--chip)}.fill-hold{fill:var(--hold)}
.ln{fill:none;stroke:var(--mute);stroke-width:2}
.ln-risk{fill:none;stroke:var(--risk);stroke-width:2.5}
.ln-ok{fill:none;stroke:var(--ok);stroke-width:2.5}
.dash{stroke-dasharray:7 6}
.draw{stroke-dasharray:1 1}
.cue{opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease;transform-box:fill-box}
.cue.on{opacity:1;transform:none}
.cue.pop{transform:scale(.85);transform-origin:center}.cue.pop.on{transform:none}
.mover{transition:none}
@media (prefers-reduced-motion: reduce){.cue{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

/* ---------- timeline ---------- */
const scenes = SB.scenes.map(s => ({...s}));
let acc = 0; scenes.forEach(s => { s.start = acc; acc += s.dur; });
const TOTAL = acc;
const stage = document.getElementById('stage'), capEl = document.getElementById('caption'), srCap = document.getElementById('srcaption');
let cur = -1, svg = null, lists = null, time = 0, playing = false, slides = false, voice = false, lastBeat = null, last = 0;

function svgFor(id){ return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(scenes.find(s=>s.id===id).title)}">${defs}${VIS[id]()}</svg>`; }
function mount(i){
  if (svg) svg.remove();
  stage.insertAdjacentHTML('afterbegin', svgFor(scenes[i].id));
  svg = stage.querySelector('svg');
  lists = {cues:[...svg.querySelectorAll('[data-t]')], draws:[...svg.querySelectorAll('[data-d0]')], movers:[...svg.querySelectorAll('[data-m]')].map(m => ({el:m, p:svg.querySelector('#'+m.dataset.m)}))};
  cur = i; renderPanel(i); markChapters(i);
}
const clamp = v => Math.max(0, Math.min(1, v));
const ease = p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
function applyT(L, t){
  for (const c of L.cues){ const on = t >= +c.dataset.t && (c.dataset.off===undefined || t < +c.dataset.off); c.classList.toggle('on', on); }
  for (const d of L.draws){ d.style.strokeDashoffset = 1 - clamp((t - d.dataset.d0)/(d.dataset.d1 - d.dataset.d0)); }
  for (const {el,p} of L.movers){
    const m0 = +el.dataset.m0, m1 = +el.dataset.m1, len = p.getTotalLength();
    let pr = ease(clamp((t-m0)/(m1-m0)));
    if (el.dataset.hold !== undefined && t < m0) pr = 0;
    const pt = p.getPointAtLength(pr*len);
    el.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
    const hidden = (el.dataset.hold === undefined && t < m0) || (el.dataset.mh && t > m1);
    el.style.opacity = hidden ? 0 : 1;
  }
}
function render(){
  let i = scenes.findIndex(s => time < s.start + s.dur); if (i < 0) i = scenes.length-1;
  if (i !== cur) mount(i);
  const s = scenes[i], t = time - s.start;
  applyT(lists, t);
  const beat = [...s.beats].reverse().find(b => t >= b[0]) || s.beats[0];
  if (beat !== lastBeat){
    capEl.textContent = beat[1]; srCap.textContent = beat[1]; lastBeat = beat;
    if (voice && playing) speak(beat[1]);
  }
  document.getElementById('eyebrow').textContent = s.eyebrow;
  document.getElementById('scenetitle').textContent = s.title;
  document.getElementById('clock').textContent = `${fmt(time)} / ${fmt(TOTAL)}`;
  document.getElementById('scrub').value = Math.round(time/TOTAL*1000);
}
const fmt = x => `${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
function tick(now){
  if (!playing) return;
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  const s = scenes[cur];
  let nt = time + dt;
  if (slides && nt >= s.start + s.dur - 0.01){ nt = s.start + s.dur - 0.01; setPlaying(false); }
  if (nt >= TOTAL){ nt = TOTAL - 0.01; setPlaying(false); }
  time = nt; render();
  if (playing) requestAnimationFrame(tick);
}
function setPlaying(p){
  playing = p; document.getElementById('play').textContent = p ? 'Pause' : (time >= TOTAL-0.05 ? 'Replay' : 'Play');
  if (p){ if (time >= TOTAL-0.05) { time = 0; } last = performance.now(); requestAnimationFrame(tick); }
  else if (window.speechSynthesis) speechSynthesis.cancel();
}
function goScene(i, playAfter){
  i = Math.max(0, Math.min(scenes.length-1, i)); time = scenes[i].start + 0.001; lastBeat = null; render();
  if (playAfter) setPlaying(true);
}
function speak(text){
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = 1.04; speechSynthesis.speak(u); } catch(e){}
}

/* ---------- the written brief beside the stage ---------- */
function renderPanel(i){
  const s = scenes[i], p = s.panel, el = document.getElementById('panel');
  let h = `<div><div class="eyebrow">${esc(s.eyebrow)}</div><h2>${esc(s.title)}</h2></div>`;
  if (p.asks) h += `<div><h3>Asks</h3><p>${esc(p.asks)}</p></div>`;
  h += `<div><h3>What</h3><p>${esc(p.what)}</p></div>`;
  if (p.before) h += `<div><h3>Before any apply</h3><p>${esc(p.before)}</p></div>`;
  if (p.options){
    h += `<div><h3>Options</h3><ul class="opts">` + p.options.map(o => `<li class="${o[0]===p.rec?'rec':''} ${o[2]==='no'?'no':''}"><b>${o[0]}</b><span>${esc(o[1])}${o[0]===p.rec?'<span class="tag rec">recommended</span>':''}${o[2]==='no'?'<span class="tag">not advised</span>':''}</span></li>`).join('') + `</ul></div>`;
  }
  if (p.blocks) h += `<div><h3>Blocks</h3><p>${esc(p.blocks)}</p></div>`;
  if (p.answer){
    h += `<div><h3>Recommended answer</h3><div class="answer" id="answer">${esc(SB.answer)}</div></div>
          <div><button class="btn" id="copy">Copy the answer</button> <span class="src" id="copied"></span></div>
          <p class="src">Answer in pm.aws.a's session: <span class="t-mono" style="user-select:all">https://claude.ai/code/session_018yvwtLfieUut6hSirZ6W9B</span></p>`;
  }
  h += `<p class="note">Source: docs/board/decisions.md and docs/security/risks.md in Site__Platform__AWS, work/pm.aws.a. Diagrams simplify; the written brief is the record. Voice, when on, is your browser's built-in synthetic voice.</p>`;
  el.innerHTML = h;
  const c = document.getElementById('copy');
  if (c) c.onclick = () => {
    const done = m => document.getElementById('copied').textContent = m;
    navigator.clipboard?.writeText(SB.answer).then(() => done('Copied'), () => { getSelection().selectAllChildren(document.getElementById('answer')); done('Selected: press copy'); })
      ?? (getSelection().selectAllChildren(document.getElementById('answer')), done('Selected: press copy'));
  };
}

/* ---------- chapters, controls, keys ---------- */
const chap = document.getElementById('chapters');
chap.innerHTML = scenes.map((s,i) => `<button data-i="${i}" title="${esc(s.title)}">${i===0?'Intro':i===scenes.length-1?'Answer':i}</button>`).join('');
chap.onclick = e => { const b = e.target.closest('button'); if (b) goScene(+b.dataset.i, playing); };
function markChapters(i){ [...chap.children].forEach((b,k) => b.classList.toggle('cur', k===i)); }
document.getElementById('play').onclick = () => setPlaying(!playing);
document.getElementById('prev').onclick = () => goScene(cur - 1, playing);
document.getElementById('next').onclick = () => goScene(cur + 1, playing || slides);
document.getElementById('scrub').oninput = e => { time = e.target.value/1000*TOTAL; if (time >= TOTAL) time = TOTAL-0.01; lastBeat = null; render(); };
document.getElementById('mode').onclick = e => { slides = !slides; e.currentTarget.setAttribute('aria-pressed', slides); };
document.getElementById('voice').onclick = e => { voice = !voice && 'speechSynthesis' in window; e.currentTarget.setAttribute('aria-pressed', voice); if (!voice && window.speechSynthesis) speechSynthesis.cancel(); else if (voice && lastBeat) speak(lastBeat[1]); };
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') goScene(cur + 1, playing || slides);
  if (e.key === 'ArrowLeft') goScene(cur - 1, playing);
});

/* ---------- storyboard view ---------- */
function thumbSvg(id, t){
  const wrap = document.createElement('div'); wrap.innerHTML = svgFor(id);
  const sv = wrap.firstElementChild;
  document.body.appendChild(sv); sv.style.position='absolute'; sv.style.left='-9999px'; sv.style.width='960px';
  const L = {cues:[...sv.querySelectorAll('[data-t]')], draws:[...sv.querySelectorAll('[data-d0]')], movers:[...sv.querySelectorAll('[data-m]')].map(m => ({el:m, p:sv.querySelector('#'+m.dataset.m)}))};
  sv.querySelectorAll('.cue').forEach(c => c.style.transition='none');
  applyT(L, t); sv.removeAttribute('style'); sv.remove();
  sv.querySelectorAll('[id]').forEach(n => { if (n.tagName !== 'marker') n.removeAttribute('id'); });
  return sv.outerHTML;
}
function buildBoard(){
  const b = document.getElementById('board'); let h = '', n = 0;
  scenes.forEach(s => s.beats.forEach((bt,k) => {
    n++;
    const end = k+1 < s.beats.length ? s.beats[k+1][0] : s.dur;
    h += `<article class="beat"><div class="thumb">${thumbSvg(s.id, Math.max(bt[0], end-0.05))}</div><div class="body">
      <div class="meta"><span>${String(n).padStart(2,'0')} · ${esc(s.eyebrow.split(' · ')[0])}</span><span>${fmt(s.start+bt[0])}</span></div>
      <div class="nar">${esc(bt[1])}</div><div class="vis">${esc(bt[2])}</div></div></article>`;
  }));
  b.innerHTML = h;
}
let boardBuilt = false;
const tabs = {brief:document.getElementById('tab-brief'), board:document.getElementById('tab-board')};
function showTab(which){
  tabs.brief.setAttribute('aria-selected', which==='brief'); tabs.board.setAttribute('aria-selected', which==='board');
  document.getElementById('view-brief').hidden = which!=='brief'; document.getElementById('view-board').hidden = which!=='board';
  if (which==='board'){ if (!boardBuilt){ buildBoard(); boardBuilt = true; } setPlaying(false); }
  try { history.replaceState(null,'', which==='board' ? '#storyboard' : '#brief'); } catch(e){}
}
tabs.brief.onclick = () => showTab('brief'); tabs.board.onclick = () => showTab('board');

window.__brief = {svgFor, scenes};  /* read by build-video.mjs */
/* at rest: the intro fully drawn, ready to play */
time = scenes[0].dur - 0.01; render();
document.querySelectorAll('.cue').forEach(c => { c.style.transition='none'; requestAnimationFrame(() => c.style.transition=''); });
if (location.hash === '#storyboard') showTab('board');
window.addEventListener('hashchange', () => showTab(location.hash==='#storyboard'?'board':'brief'));
})();
</script>
