<script id="sb" type="application/json">{"format":"studio-storyboard/0","slug":"aws-guard-rails-2026-11-23","title":"Guard rails: nine numbers","audience":"Dinis","requested_by":"pm.aws.a@SovereignWebsite.dinis","summary":"Batch 3: nine guard rails (G1 to G9) for short-lived deployments and the daily region move, drafted by ec2.aws.a, reviewed by security.aws.a. Lower-bound list prices; approving creates nothing in AWS.","beats":[{"id":"b0","narration":"Nine guard rails for short-lived deployments and the daily move. Approving them creates nothing in AWS.","visual":{"kind":"svg","src":"intro","caption":"Batch 3: guard rails","at":0,"play":7,"end":6.4},"facts":["s-ec2","s-sec"]},{"id":"bg1","narration":"G1. Recommended: two hours by default, four as the hard cap.","visual":{"kind":"svg","src":"g1","caption":"G1: Lifetime","at":0,"play":5,"end":4.4},"facts":["s-ec2","s-sec"]},{"id":"bg2","narration":"G2. Recommended: each daily-move copy capped at 26 hours, as a backstop.","visual":{"kind":"svg","src":"g2","caption":"G2: Daily move","at":0,"play":5.4,"end":4.8},"facts":["s-ec2","s-sec"]},{"id":"bg3","narration":"G3. Recommended: London and Ireland only, the two priced today.","visual":{"kind":"svg","src":"g3","caption":"G3: Regions","at":0,"play":4.6,"end":4},"facts":["s-ec2","s-sec"]},{"id":"bg4","narration":"G4. Recommended: the three smallest Graviton types, standard credits.","visual":{"kind":"svg","src":"g4","caption":"G4: Instance types","at":0,"play":4.2,"end":3.6},"facts":["s-ec2","s-sec"]},{"id":"bg5","narration":"G5. Recommended: three at once at most, a low vCPU quota behind it.","visual":{"kind":"svg","src":"g5","caption":"G5: Count","at":0,"play":5.8,"end":5.2},"facts":["s-ec2","s-sec"]},{"id":"bg6","narration":"G6. Recommended: alert at 25 dollars. Whether it also stops new deployments is your pick.","visual":{"kind":"svg","src":"g6","caption":"G6: Cost alert","at":0,"play":6.6,"end":6},"facts":["s-ec2","s-sec","s-flood"]},{"id":"bg7","narration":"G7. Recommended: stop new in one click; end all only with your approval.","visual":{"kind":"svg","src":"g7","caption":"G7: Kill switch","at":0,"play":5.8,"end":5.2},"facts":["s-ec2","s-sec"]},{"id":"bg8","narration":"G8. Recommended: the sweeper as a scheduled function in our account.","visual":{"kind":"svg","src":"g8","caption":"G8: Sweeper","at":0,"play":5,"end":4.4},"facts":["s-ec2","s-sec"]},{"id":"bg9","narration":"G9. Recommended: a week of daily moves in the twin before any real move.","visual":{"kind":"svg","src":"g9","caption":"G9: The move","at":0,"play":6.2,"end":5.6},"facts":["s-ec2","s-sec"]},{"id":"bz","narration":"All a, except G1, a plus b, and G9, b then a. For G6, pick alert only or automatic stop. Answer in pm.aws.a's session.","visual":{"kind":"svg","src":"outro","caption":"Recommended: G1 a+b, G2 a, G3 a, G4 a, G5 a, G6 a with (i) or (ii), G7 a, G8 a, G9 b then a","at":0,"play":10.2,"end":9.6},"facts":["s-ec2"]}],"decisions":[{"id":"G1","question":"G1. How long a short-lived deployment may live?","options":[{"id":"a","label":"a. 2 h (0.0476 USD)","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. 4 h (0.0952 USD)","good":[],"bad":[],"blocks":[]},{"id":"c","label":"c. 8 h","good":[],"bad":[],"blocks":[]}],"recommendation":"a","why":"Recommended: a+b. Default (a) 2 hours, hard cap (b) 4 hours. Costs at most 0.0476 and 0.0952 USD (t4g.small plus a public IPv4). Security: the lifetime tag is set only at launch; no role can change it."},{"id":"G2","question":"G2. How long each daily-move copy may live?","options":[{"id":"a","label":"a. 26 h (0.6188 USD)","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. 30 h","good":[],"bad":[],"blocks":[]},{"id":"c","label":"c. no cap","good":[],"bad":[],"blocks":[]}],"recommendation":"a","why":"Recommended: a. (a) 26 h: 0.6188 USD a copy at the cap; 17.37 USD always on for a month. Past 26 h the sweeper alerts first and deletes a copy only once its replacement answers."},{"id":"G3","question":"G3. Which regions are allowed?","options":[{"id":"a","label":"a. London + Ireland","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. more, later","good":[],"bad":[],"blocks":[]}],"recommendation":"a","why":"Recommended: a. (a) now; (b) by a later decision once billing prices them and the twin tests them. Security: the region condition applies to regional actions only."},{"id":"G4","question":"G4. Which instance types are allowed?","options":[{"id":"a","label":"a. nano, micro, small (0.0047 to 0.0188/h USD)","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. + medium (0.0376/h USD)","good":[],"bad":[],"blocks":[]}],"recommendation":"a","why":"Recommended: a. (a); medium only if the twin load test says so. Standard credits checked by the test suite and in the plan read-back."},{"id":"G5","question":"G5. How many at once?","options":[{"id":"a","label":"a. 3 at most","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. you name","good":[],"bad":[],"blocks":[]}],"recommendation":"a","why":"Recommended: a. (a). A runaway loop is the main cost risk. The vCPU quota is an AWS change of its own, and account-wide."},{"id":"G6","question":"G6. The monthly cost alert?","options":[{"id":"a","label":"a. 25 USD","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. 50 USD","good":[],"bad":[],"blocks":[]},{"id":"c","label":"c. 100 USD","good":[],"bad":[],"blocks":[]}],"recommendation":"a","why":"Recommended: a. At the cap: (i) alert only, recommended by security.aws.a; (ii) alert plus an automatic stop new (Budgets action, deletes nothing, undone by detaching the policy), recommended by ec2.aws.a. Your pick. New (billing.aws.a, ddddb44): a request flood through CloudFront is billed per request at the edge, about $46 an hour at 10,000 requests a second in London, so a $25 alert would be reached within an hour; billing is pricing an edge rate limit (AWS WAF) and a billing alarm."},{"id":"G7","question":"G7. The kill switch?","options":[{"id":"a","label":"a. stop new: 1 click","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. end all: 1 click","good":[],"bad":[],"blocks":[]}],"recommendation":"a","why":"Recommended: a. (a): deleting stacks is not undone by pressing again. Clearing stop new is also a plan you approve."},{"id":"G8","question":"G8. Where the sweeper runs?","options":[{"id":"a","label":"a. AWS schedule + Lambda","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. GitHub Actions","good":[],"bad":[],"blocks":[]},{"id":"c","label":"c. only in the site","good":[],"bad":[],"blocks":[]}],"recommendation":"a","why":"Recommended: a. (a). Each deployment also gets its own one-time delete schedule. The sweeper may only describe, alert and delete managed sws-ec2-* stacks."},{"id":"G9","question":"G9. When the daily move starts?","options":[{"id":"a","label":"a. move role now","good":[],"bad":[],"blocks":[]},{"id":"b","label":"b. twin week first","good":[],"bad":[],"blocks":[]}],"recommendation":"b","why":"Recommended: b then a. (b) first, then (a). Order fixed: the new copy answers, DNS moves, then the old copy is deleted. The move's role holds no key."}],"connections":{"asked_by":"pm.aws.a@SovereignWebsite.dinis","reviewed_by":["security.aws.a"],"acts":["ec2.aws.a","security.aws.a","billing.aws.a"],"follows":["V5 in batch 2"]},"sources":[{"id":"s-ec2","title":"ec2.aws.a: V5 guard rails decision page draft (4c55c1f)","url":"https://github.com/SovereignWebsite/Site__Platform__AWS/blob/4c55c1f/docs/ec2/2026-11-23__02-v5-guard-rails-decision.md","read":"2026-11-23"},{"id":"s-sec","title":"security.aws.a: review of the guard rails draft (d397c1f)","url":"https://github.com/SovereignWebsite/Site__Platform__AWS/blob/d397c1f/docs/security/reviews/2026-11-23__ec2-v5-guard-rails.md","read":"2026-11-23"},{"id":"s-flood","title":"billing.aws.a: flood.mjs, edge requests are not capped by concurrency (ddddb44)","url":"https://github.com/SovereignWebsite/Site__Platform__AWS/commit/ddddb44","read":"2026-11-23"}],"drawn_by":"pm.aws.a@SovereignWebsite.dinis; SVGs from guard-rails-brief.html by build-video.mjs; player from Site__Agent__Studio 74ed159 with two changes","voice":"Captions always; voice only if the viewer turns it on (the browser's synthetic voice). The presenter is synthetic, not a real person."}</script>
